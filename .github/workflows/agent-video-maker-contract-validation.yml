name: Agent Video Maker contract validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/freeze-video-maker-mvp-contract

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Contract tests
        run: npm run test:contract
      - name: Build
        run: npm run build
