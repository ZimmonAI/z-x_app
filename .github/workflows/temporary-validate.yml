name: Temporary validation

# Source-only validation evidence; remove before final merge.
on:
  push:
    branches:
      - agent/issue-5-status-env-compatibility
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: z_x_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_x_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full validation
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee validation.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          if-no-files-found: error
      - name: Propagate validation failure
        if: steps.validation.outcome != 'success'
        run: exit 1
