name: validate-neutral-foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: zx
          POSTGRES_DB: zx_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zx -d zx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://zx@127.0.0.1:5432/zx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@10.9.2
      - run: npm ci
      - run: npm run validate
