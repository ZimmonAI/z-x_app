name: Validate Status env compatibility repair

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: z_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d z_x_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/z_x_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install from committed lockfile
        run: npm ci
      - name: Run exact validation chain
        run: npm run validate
      - name: Capture machine-readable test evidence
        run: npm run test -- --reporter=json --outputFile=validation-tests.json
      - name: Upload validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: status-env-validation-evidence
          path: validation-tests.json
          retention-days: 1
