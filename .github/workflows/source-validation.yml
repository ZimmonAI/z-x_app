name: source-validation-03b0

on:
  push:
    branches:
      - agent/resolve-runtime-auth-binding-prerequisites
  pull_request:
    branches:
      - main

concurrency:
  group: zx-source-validation-03b0-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Exact source acceptance command
        run: npm ci && npm run validate

# validation trigger after draft PR creation
