name: source-validation

on:
  push:
    branches:
      - agent/implement-z-x-execution-runner-foundation
  pull_request:
    branches:
      - main

concurrency:
  group: zx-source-validation
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zx_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Exact source acceptance command
        id: validation
        shell: bash
        run: |
          set +e
          set -o pipefail
          (npm ci && npm run validate) 2>&1 | tee validation.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish validation result on draft PR
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATION_EXIT_CODE: ${{ steps.validation.outputs.exit_code }}
        with:
          script: |
            const fs = require('node:fs');
            const marker = '<!-- zx-source-validation -->';
            const exitCode = process.env.VALIDATION_EXIT_CODE || 'unknown';
            const raw = fs.existsSync('validation.log')
              ? fs.readFileSync('validation.log', 'utf8')
              : 'validation.log was not produced';
            const tail = raw.length > 52000 ? raw.slice(-52000) : raw;
            const body = `${marker}\n## Remote source validation\n\nHead: \`${context.sha}\`  \nExit code: \`${exitCode}\`\n\n<details><summary>Validation log tail</summary>\n\n\`\`\`text\n${tail}\n\`\`\`\n</details>`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 2,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 2,
                body,
              });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-${{ github.run_number }}-${{ github.run_attempt }}
          path: validation.log
          if-no-files-found: warn
      - name: Fail when validation failed
        if: ${{ steps.validation.outputs.exit_code != '0' }}
        run: exit 1
