name: Validate PR 15 Video Maker contract

on:
  push:
    branches:
      - agent/validate-pr15-video-maker-contract

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Create focused TypeScript configurations
        run: |
          cat > tsconfig.contract-check.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": { "noEmit": true },
            "include": [
              "src/contracts/video-maker/v1/**/*.ts",
              "src/validation/video-maker-request.ts",
              "tests/contract/video-maker-execution-v1.test.ts",
              "tests/contract/zx-execution-v1-compatibility.test.ts"
            ]
          }
          JSON
          cat > tsconfig.contract-build.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "rootDir": ".",
              "outDir": "/tmp/zx-video-maker-contract-build"
            },
            "include": [
              "src/contracts/video-maker/v1/**/*.ts",
              "src/validation/video-maker-request.ts"
            ]
          }
          JSON
      - name: Focused typecheck
        run: npx tsc -p tsconfig.contract-check.json --noEmit
      - name: Focused lint
        run: >-
          npx eslint
          src/contracts/video-maker/v1/compatibility.ts
          src/contracts/video-maker/v1/execution.ts
          src/contracts/video-maker/v1/index.ts
          src/validation/video-maker-request.ts
          tests/contract/video-maker-execution-v1.test.ts
          tests/contract/zx-execution-v1-compatibility.test.ts
      - name: Focused contract tests
        run: >-
          npx vitest run
          tests/contract/video-maker-execution-v1.test.ts
          tests/contract/zx-execution-v1-compatibility.test.ts
      - name: Focused build
        run: npx tsc -p tsconfig.contract-build.json
