name: source-validation-bootstrap

on:
  push:
    branches:
      - agent/implement-z-x-execution-runner-foundation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zx_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source bundle
        if: ${{ hashFiles('.bootstrap/source.part-*') != '' }}
        run: |
          cat .bootstrap/source.part-* | base64 --decode > /tmp/zx-source.tar.gz
          tar -xzf /tmp/zx-source.tar.gz -C .
          rm -rf .bootstrap /tmp/zx-source.tar.gz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bootstrap exact approved dependencies
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: |
          npm install --save-exact fastify zod pg jose pino prom-client @opentelemetry/api
          npm install --save-dev --save-exact typescript vitest eslint @eslint/js typescript-eslint @types/node @types/pg

      - name: Install from committed or generated lockfile
        run: npm ci

      - name: Full deterministic validation
        run: npm run validate 2>&1 | tee validation.log

      - name: Commit validated source and lockfile
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m "feat: implement fixture-first execution runner foundation"
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-evidence-${{ github.run_attempt }}
          path: |
            validation.log
            package.json
            package-lock.json
          if-no-files-found: warn
