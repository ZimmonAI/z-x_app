name: source-validation-bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ZX_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zx_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install exact committed dependencies
        run: npm ci

      - name: Full deterministic validation
        shell: bash
        run: |
          set -o pipefail
          npm run validate 2>&1 | tee validation.log

      - name: Materialize exact validated source tree
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'agent/implement-z-x-execution-runner-foundation';
            const excludedDirectories = new Set([
              '.git',
              '.github',
              '.bootstrap',
              '.bootstrap-fix',
              '.bootstrap-patch',
              'node_modules',
              'dist',
            ]);
            const excludedFiles = new Set(['validation.log', 'reconstruct.log']);
            function walk(directory) {
              const files = [];
              for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
                if (entry.isDirectory() && excludedDirectories.has(entry.name)) continue;
                if (entry.isFile() && excludedFiles.has(entry.name)) continue;
                const absolute = path.join(directory, entry.name);
                if (entry.isDirectory()) files.push(...walk(absolute));
                else if (entry.isFile()) files.push(absolute);
              }
              return files;
            }
            const root = process.cwd();
            const files = walk(root).sort();
            const tree = [];
            for (const absolute of files) {
              const relative = path.relative(root, absolute).split(path.sep).join('/');
              const content = fs.readFileSync(absolute).toString('base64');
              const { data: blob } = await github.rest.git.createBlob({
                owner,
                repo,
                content,
                encoding: 'base64',
              });
              tree.push({ path: relative, mode: '100644', type: 'blob', sha: blob.sha });
            }
            const { data: ref } = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            const { data: createdTree } = await github.rest.git.createTree({ owner, repo, tree });
            const { data: commit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'feat: implement fixture-first execution runner foundation',
              tree: createdTree.sha,
              parents: [ref.object.sha],
            });
            await github.rest.git.updateRef({
              owner,
              repo,
              ref: `heads/${branch}`,
              sha: commit.sha,
              force: false,
            });
            core.notice(`Published validated source commit ${commit.sha} with ${tree.length} files`);

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-validation-evidence-${{ github.run_attempt }}
          path: |
            validation.log
            package.json
            package-lock.json
          if-no-files-found: warn
